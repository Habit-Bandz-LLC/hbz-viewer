<!DOCTYPE html>
<html>
<head>
  <title>Habit Bandz – Last 24h Activity</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js"></script>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; padding: 2rem; }
    canvas { background: #222; padding: 1rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>📈 Habit Bandz – Last 24h Event Activity</h1>
  <canvas id="eventChart" width="600" height="300"></canvas>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCRBO8speYo14mppTmPUkEFM6e_0APNJc0",
      authDomain: "habit-bandz-apple-watch.firebaseapp.com",
      projectId: "habit-bandz-apple-watch"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userId = "d3OIzg1IAdMO57MYjs2I0RQUeGG2";
    const outputCounts = new Array(24).fill(0); // Hourly bucket
    const now = new Date();
    const cutoff = new Date(now.getTime() - 24 * 60 * 60 * 1000);

    // Fetch sessions for that user
    db.collection(`users/${userId}/sessions`).get().then(snapshot => {
      snapshot.forEach(doc => {
        const session = doc.data();
        const events = session.events || [];

        events.forEach(event => {
          const timestamp = new Date(event.timestamp);
          if (timestamp > cutoff) {
            const hourAgo = 23 - Math.floor((now - timestamp) / (60 * 60 * 1000));
            if (hourAgo >= 0 && hourAgo < 24) {
              outputCounts[hourAgo]++;
            }
          }
        });
      });

      renderChart(outputCounts);
    });

    function renderChart(counts) {
      const ctx = document.getElementById("eventChart").getContext("2d");
      new Chart(ctx, {
        type: "bar",
        data: {
          labels: [...Array(24)].map((_, i) => `${24 - i}h ago`),
          datasets: [{
            label: "Event count",
            data: counts,
            backgroundColor: "rgba(0, 255, 255, 0.6)",
            borderColor: "#0ff",
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            y: { beginAtZero: true },
            x: { ticks: { color: "#ccc" } },
          },
          plugins: {
            legend: { labels: { color: "#fff" } }
          }
        }
      });
    }
  </script>
</body>
</html>
