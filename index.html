<!DOCTYPE html>
<html>
<head>
  <title>Habit Bandz Session Logs</title>
  <style>
    body { font-family: monospace; padding: 1rem; background: #111; color: #0f0; }
    h1 { color: #0ff; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js"></script>
</head>
<body>
  <h1>📊 Habit Bandz Sessions</h1>
  <pre id="output">Loading session data...</pre>

  <script>
    // ✅ Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCRBO8speYo14mppTmPUkEFM6e_0APNJc0",
      authDomain: "habit-bandz-apple-watch.firebaseapp.com",
      projectId: "habit-bandz-apple-watch",
      storageBucket: "habit-bandz-apple-watch.appspot.com",
      messagingSenderId: "1067690731758",
      appId: "1:1067690731758:web:b4c51a31c27950d5316bff",
      measurementId: "G-NBSHYJCDVS"
    };

    // ✅ Init
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ✅ Query sessions from all users
    db.collectionGroup("sessions").get().then(snapshot => {
      const sessions = [];
      snapshot.forEach(doc => sessions.push(doc.data()));
      document.getElementById("output").textContent = JSON.stringify(sessions, null, 2);
    }).catch(err => {
      document.getElementById("output").textContent = "❌ Error: " + err.message;
    });
  </script>
</body>
</html>
